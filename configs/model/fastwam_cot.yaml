_target_: fastwam.runtime.create_fastwam_cot
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

# Model initialization mode
# Options:
#   - "wan_backbone": Use Wan official weights for Video/Action (same as before)
#   - "fastwam": Use fastwam_release checkpoint for RobotWin
init_mode: "fastwam"

# Path to fastwam_release checkpoint (for fastwam mode)
fastwam_checkpoint_path: checkpoints/fastwam_release/robotwin_uncond_3cam_384.pt

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal"
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

cot_dit_config:
  hidden_dim: 512
  ffn_dim: 2048
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  vlm_input_dim: 2048
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  vlm_adapter_type: "mlp3x_silu"
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

cot_dit_pretrained_path: checkpoints/cot_dit_from_motus.pt

vlm_config:
  extract_mode: "online"  # "precomputed" or "online"
  model_path: "checkpoints/Qwen3-VL-2B"
  precomputed_features_dir: null

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0

training:
  video_dit_mode: "lora32"
  action_dit_mode: "full"
  lora_target_modules: null
  lora_alpha_ratio: 1.0
  lora_dropout: 0.0
